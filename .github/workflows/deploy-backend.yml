# Uploads backend/src to the Apps Script project with clasp (same setup as
# Fram-Automation). Runs when backend/ changes on main, or by hand.
#
# Needs (see docs/SETUP-BACKEND.md):
#   - backend/.clasp.json with the real scriptId
#   - repository secret CLASPRC_JSON (contents of ~/.clasprc.json after `clasp login`)
#   - optional secret DEPLOYMENT_ID: the web app deployment to update, so changes go live
# Until the first two exist the job skips itself.

name: Deploy backend

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/deploy-backend.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: deploy-backend
    steps:
      - uses: actions/checkout@v4

      - name: Check setup
        id: ready
        env:
          CLASPRC: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC" ] || grep -q 'REPLACE_WITH_SCRIPT_ID' backend/.clasp.json; then
            echo "Backend not set up yet (phase 4). Skipping."; echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.ready.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - if: steps.ready.outputs.ok == 'true'
        run: npm install -g @google/clasp@2.4.2

      - if: steps.ready.outputs.ok == 'true'
        name: Upload to Apps Script
        env:
          CLASPRC: ${{ secrets.CLASPRC_JSON }}
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        working-directory: backend
        run: |
          printf '%s' "$CLASPRC" > ~/.clasprc.json
          clasp push --force
          if [ -n "$DEPLOYMENT_ID" ]; then
            clasp deploy -i "$DEPLOYMENT_ID" -d "GitHub ${GITHUB_SHA::7}"
          else
            echo "No DEPLOYMENT_ID secret: code uploaded, but publish a new version by hand (Deploy → Manage deployments)."
          fi
