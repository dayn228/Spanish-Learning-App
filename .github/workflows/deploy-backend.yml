# Uploads backend/src to the Apps Script project with clasp (same setup as
# Fram-Automation). Runs when backend/ changes on main, or by hand.
#
# Needs, before it can run (phase 4):
#   - backend/.clasp.json with the real scriptId
#   - repository secret CLASPRC_JSON (contents of ~/.clasprc.json after `clasp login`)
# Until then the job skips itself.

name: Deploy backend

on:
  push:
    branches: [main]
    paths: ['backend/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: deploy-backend
    steps:
      - uses: actions/checkout@v4

      - name: Check setup
        id: ready
        env:
          CLASPRC: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC" ] || grep -q 'REPLACE_WITH_SCRIPT_ID' backend/.clasp.json; then
            echo "Backend not set up yet (phase 4). Skipping."; echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.ready.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - if: steps.ready.outputs.ok == 'true'
        run: npm install -g @google/clasp@2.4.2

      - if: steps.ready.outputs.ok == 'true'
        name: Upload to Apps Script
        env:
          CLASPRC: ${{ secrets.CLASPRC_JSON }}
        working-directory: backend
        run: |
          printf '%s' "$CLASPRC" > ~/.clasprc.json
          clasp push --force
